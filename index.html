<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AACS - Entrada Principal e Atendimento</title>
    <!-- Bootstrap 5.3 CSS para layout responsivo e acessível -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilização para garantia dos requisitos de acessibilidade (RNF04) */
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .touch-target {
            min-height: 52px; /* Supera a exigência de 48px */
            font-size: 1.1rem;
            font-weight: 600;
        }
        .contrast-btn {
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
        }
        .contrast-btn:hover, .contrast-btn:focus {
            background-color: #0b5ed7;
            color: #ffffff;
        }
        .form-control-lg {
            min-height: 50px;
            font-size: 1.2rem;
        }
        .card-custom {
            border-radius: 12px;
            border: 1px solid #dee2e6;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Cabeçalho de Navegação com Perfis e Logout (RNF01) -->
    <nav class="navbar navbar-dark bg-primary px-3 mb-4">
        <div class="container-fluid max-width-md">
            <span class="navbar-brand fw-bold fs-5">
                🛡️ AACS — Gestão de Doações
            </span>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white d-none d-sm-inline small">Voluntário: João</span>
                <a href="#logout" class="btn btn-outline-light btn-sm" role="button">Sair 🚪</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal e Busca do Assistido (RF01, RNF02, RNF04) -->
    <main class="container my-auto" style="max-width: 500px;">
        
        <!-- Cartão Principal de Operação -->
        <div class="card card-custom p-4 bg-white">
            <h1 class="h4 text-center fw-bold text-dark mb-1">
                Atendimento e Recepção
            </h1>
            <p class="text-secondary text-center small mb-4">
                Verifique a elegibilidade do assistido para entrega da cesta básica mensal.
            </p>

            <form action="#confirmar" method="GET" id="formBusca">
                <!-- Token CSRF Oculto de Segurança (RNF02) -->
                <input type="hidden" name="csrf_token" value="d9a8f7e6c5b4a321">

                <!-- Campo com Label Rótulo Persistente Associado (RNF04) -->
                <div class="mb-4">
                    <label for="cpf_busca" class="form-label fw-bold text-dark fs-6">
                        CPF do Responsável Familiar:
                    </label>
                    <input 
                        type="text" 
                        class="form-control form-control-lg" 
                        id="cpf_busca" 
                        name="cpf" 
                        placeholder="000.000.000-00" 
                        inputmode="numeric"
                        maxlength="14"
                        required
                        aria-describedby="cpfHelp"
                    >
                    <div id="cpfHelp" class="form-text text-muted">
                        Insira os 11 dígitos do CPF do responsável cadastrado.
                    </div>
                </div>

                <!-- Botão de Ação Principal Clicável de Alta Dimensão (RNF04) -->
                <button type="submit" class="btn contrast-btn w-100 touch-target d-flex align-items-center justify-content-center gap-2 mb-3">
                    🔍 PESQUISAR E VERIFICAR ELEGIBILIDADE
                </button>
            </form>

            <!-- Acesso Secundário ao Estoque PEPS -->
            <hr class="my-3">
            <div class="text-center">
                <a href="#estoque" class="btn btn-outline-secondary w-100 touch-target d-flex align-items-center justify-content-center gap-2">
                    📦 Ver Painel do Estoque (PEPS)
                </a>
            </div>
        </div>

        <!-- Indicador de Status Operacional do PWA -->
        <div class="text-center mt-3 text-muted small">
            <span>● Modo On-line (Conectado ao Supabase)</span>
        </div>
    </main>

    <!-- Simulação simples de máscara no CPF -->
    <script>
        const cpfInput = document.getElementById('cpf_busca');
        cpfInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = value;
        });
    </script>
</body>
</html>
